[project]
name = "audit-log"
version = "0.1.1"
description = "An append-only, tamper-evident record as an iii worker: one writer, fsynced, hash-chained"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "iii-sdk==0.26.0",
    "iii-helpers==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
